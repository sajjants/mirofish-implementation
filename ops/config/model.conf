# Local LLM settings, sourced by ops/scripts/*.sh (bash syntax: KEY=value, no spaces).
# Edit HF_MODEL_REF after verifying the repository name and quant tag on huggingface.co.

# Hugging Face GGUF pulled through Ollama: hf.co/<org>/<repo>:<quant>
# VERIFY before pulling. Hardware tier guide (GPU-usable memory):
#   >= 24 GB : 27-32B class   e.g. hf.co/unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M  (MoE, non-thinking)
#                             or   hf.co/Qwen/Qwen3-32B-GGUF:Q4_K_M                      (dense, hybrid thinking)
#   16 GB    : 14B class      e.g. hf.co/Qwen/Qwen3-14B-GGUF:Q4_K_M
#   8-12 GB  : 8B class       e.g. hf.co/Qwen/Qwen3-8B-GGUF:Q4_K_M
HF_MODEL_REF=hf.co/unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M

# Name of the derived Ollama model (with our Modelfile parameters). MiroFish's LLM_MODEL_NAME must match.
OLLAMA_MODEL_ALIAS=mirofish-llm

# Context window baked into the derived model. MiroFish cannot pass num_ctx through the
# OpenAI-compatible endpoint, so it must live in the Modelfile. Minimum 16384.
NUM_CTX=32768

# Embedding model for the local memory-layer adapter (ops/ZEP_DECISION.md option a).
# Verified to exist on 2026-11-14: Qwen/Qwen3-Embedding-0.6B-GGUF (Apache-2.0), file Q8_0.
EMBED_MODEL_REF=hf.co/Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
EMBED_MODEL_ALIAS=mirofish-embed

# Ollama must listen on loopback only.
OLLAMA_HOST=127.0.0.1:11434

# Ollama binary. Empty = project-local .tools/ollama/current/ollama if present, else `ollama` on PATH.
OLLAMA_BIN=

# Server settings used by ops/scripts/ollama_serve.sh.
# Each parallel slot reserves its own num_ctx KV cache; 4 x 32k fits comfortably in 72 GB with a 30B-A3B model.
OLLAMA_NUM_PARALLEL=4
OLLAMA_KEEP_ALIVE=30m

# doctor.sh structured-JSON test: minimum passes out of 5 to report PASS.
JSON_MIN_PASS=4
